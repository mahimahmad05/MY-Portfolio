<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261022">
  <link rel="stylesheet" href="certificates.css?v=20261022">
</head>
<body data-title="Certificates">

  <div class="pageload on" id="pageload" aria-hidden="true">
    <div class="pageload__name">MAHIM</div>
    <div class="pageload__bar"><i></i></div>
  </div>

  <header class="nav">
    <a class="nav__logo" id="logo" href="#home"></a>
    <button class="nav__toggle" id="navToggle" aria-label="Menu">☰</button>
    <nav class="nav__links" id="navLinks"></nav>
  </header>

  <main>
    <section class="cert-sec" id="certificates" hidden>
      <div class="cert-wrap">
        <div class="sec-head">
          <span class="sec-num"><span id="certNum"></span></span>
          <span class="sec-title" id="certTitle"></span>
          <span class="sec-head-icon" id="certHeadIcon"></span>
          <span class="sec-line"></span>
        </div>
        <div class="cert-carousel"><div class="cert-track" id="certTrack"></div></div>
        <div class="cert-nav" id="certNav">
          <button class="cert-nav-btn" id="certPrev" type="button" aria-label="Previous"></button>
          <div class="cert-dots" id="certDots"></div>
          <button class="cert-nav-btn" id="certNext" type="button" aria-label="Next"></button>
        </div>
      </div>
    </section>
  </main>

  <div class="cx-modal cx-image" id="certModal" aria-hidden="true">
    <div class="cx-backdrop" id="certBackdrop"></div>
    <div class="cx-box cx-imgbox">
      <button class="cx-close" id="certClose" type="button" aria-label="Close">&times;</button>
      <img src="" alt="Certificate" id="certImage">
      <p class="cx-fallback" id="certFallback">Certificate image not added yet.</p>
    </div>
  </div>

  <div class="cx-modal" id="certDetailModal" aria-hidden="true">
    <div class="cx-backdrop" id="certDetailBackdrop"></div>
    <div class="cx-box">
      <button class="cx-close" id="certDetailClose" type="button" aria-label="Close">&times;</button>
      <div class="cx-scroll">
        <div class="cx-head">
          <div class="cx-icon" id="certDetailIcon"></div>
          <div><div class="cx-title" id="certDetailTitle"></div><div class="cx-desc" id="certDetailDesc"></div></div>
        </div>
        <div class="cx-rows" id="certDetailRows"></div>
      </div>
    </div>
  </div>

  <aside class="chat" id="chat" hidden aria-label="Chatbot">
    <header class="chat__head">
      <div><strong id="chatTitle"></strong><span id="chatSub"></span></div>
      <button type="button" id="chatClose" aria-label="Close chat">✕</button>
    </header>
    <div class="chat__log" id="chatLog" aria-live="polite"></div>
    <form class="chat__form" id="chatForm">
      <input id="chatInput" type="text" autocomplete="off" aria-label="Your message">
      <button type="submit">Send</button>
    </form>
  </aside>

  <script src="certificates.js?v=20261022"></script>
  <script src="script.js?v=20261022"></script>
</body>
</html>
