<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20262801">
  <link rel="stylesheet" href="projects.css?v=20261181">
  <link rel="stylesheet" href="contact.css?v=20261133">
  <link rel="stylesheet" href="footer.css?v=20261403">
</head>
<body data-title="Contact">

  <div class="pageload on" id="pageload" aria-hidden="true">
    <div class="pageload__name">MAHIM</div>
    <div class="pageload__bar"><i></i></div>
  </div>
  <script src="loader.js?v=20261319"></script>

  <header class="nav">
    <a class="nav__logo" id="logo" href="#home"></a>
    <button class="nav__toggle" id="navToggle" aria-label="Menu">☰</button>
    <nav class="nav__links" id="navLinks"></nav>
  </header>

  <main>
    <section class="contact-sec" id="contact" hidden>
      <div class="contact-wrap">
        <div class="sec-head">
          <span class="sec-num"><span id="contactNum"></span></span>
          <span class="sec-title" id="contactTitle"></span>
          <span class="sec-head-icon" id="contactHeadIcon"></span>
          <span class="sec-line"></span>
        </div>
        <p class="contact-sub-top" id="contactSub"></p>
        <div class="ct-status" id="ctStatus"></div>

        <div class="contact-grid">
          <div class="contact-col">
            <div class="contact-card">
              <div class="card-topbar"></div>
              <div class="contact-card-head"><span id="contactInfoIcon"></span><span id="contactInfoTitle"></span></div>
              <div class="ct-time" id="ctTime"></div>
              <div id="contactInfoList"></div>
            </div>
            <div class="contact-card">
              <div class="card-topbar"></div>
              <div class="contact-card-head"><span id="contactSocialIcon"></span><span id="contactSocialTitle"></span></div>
              <div class="social-grid" id="contactSocialList"></div>
            </div>
          </div>
          <div class="contact-col">
            <div class="contact-card">
              <div class="card-topbar"></div>
              <div class="contact-card-head"><span id="contactFormIcon"></span><span id="contactFormTitle"></span></div>
              <form id="contactForm" class="contact-form">
                <label class="cf-label" for="cfName">Full Name</label>
                <input class="cf-input" type="text" id="cfName" placeholder="Enter your full name" required>
                <label class="cf-label" for="cfEmail">Email Address</label>
                <input class="cf-input" type="email" id="cfEmail" placeholder="your.email@domain.com" required>
                <label class="cf-label" for="cfSubject">Subject</label>
                <input class="cf-input" type="text" id="cfSubject" placeholder="Project inquiry, collaboration, etc.">
                <label class="cf-label" for="cfMessage">Message</label>
                <textarea class="cf-input cf-textarea" id="cfMessage" rows="5" placeholder="Tell me a bit about what you have in mind..." required></textarea>
                <button type="submit" class="cf-submit">Send Message <span id="cfSubmitIcon"></span></button>
                <p class="cf-note" id="cfNote"></p>
              </form>
            </div>
          </div>
        </div>

        <div class="contact-cta">
          <h3 id="contactCtaTitle"></h3>
          <p id="contactCtaText"></p>
          <div class="contact-cta-buttons" id="contactCtaButtons"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <aside class="chat" id="chat" hidden aria-label="Chatbot">
    <header class="chat__head">
      <div><strong id="chatTitle"></strong><span id="chatSub"></span></div>
      <button type="button" id="chatClose" aria-label="Close chat">✕</button>
    </header>
    <div class="chat__log" id="chatLog" aria-live="polite"></div>
    <form class="chat__form" id="chatForm">
      <input id="chatInput" type="text" autocomplete="off" aria-label="Your message">
      <button type="submit">Send</button>
    </form>
  </aside>

  <script src="projects-fx.js?v=20261033"></script>
  <script src="contact.js?v=20261133"></script>
  <script src="footer.js?v=20261171"></script>
  <script src="script.js?v=20262704"></script>
</body>
</html>
