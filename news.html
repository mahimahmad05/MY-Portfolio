<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20262703">
  <link rel="stylesheet" href="projects.css?v=20261181">
  <link rel="stylesheet" href="news.css?v=20261051">
</head>
<body data-title="News & Highlights">

  <div class="pageload on" id="pageload" aria-hidden="true">
    <div class="pageload__name">MAHIM</div>
    <div class="pageload__bar"><i></i></div>
  </div>
  <script src="loader.js?v=20261319"></script>

  <header class="nav">
    <a class="nav__logo" id="logo" href="#home"></a>
    <button class="nav__toggle" id="navToggle" aria-label="Menu">☰</button>
    <nav class="nav__links" id="navLinks"></nav>
  </header>

  <main>
    <section class="nw-sec" id="newsSec" hidden>
      <div class="nw-wrap">
        <div class="sec-head">
          <span class="sec-num"><span id="nwNum"></span></span>
          <span class="sec-title" id="nwTitle"></span>
          <span class="sec-head-icon" id="nwHeadIcon"></span>
          <span class="sec-line"></span>
        </div>
        <div class="sub-sec" id="nwNews" hidden>
          <div class="sub-head"><span class="sub-icon"></span><span class="sub-title"></span></div>
          <div id="newsList"></div>
        </div>
        <div class="sub-sec" id="nwHigh" hidden>
          <div class="sub-head"><span class="sub-icon"></span><span class="sub-title"></span></div>
          <div class="hl-wrap" id="hlWrap"></div>
        </div>
      </div>
    </section>
  </main>

  <aside class="chat" id="chat" hidden aria-label="Chatbot">
    <header class="chat__head">
      <div><strong id="chatTitle"></strong><span id="chatSub"></span></div>
      <button type="button" id="chatClose" aria-label="Close chat">✕</button>
    </header>
    <div class="chat__log" id="chatLog" aria-live="polite"></div>
    <form class="chat__form" id="chatForm">
      <input id="chatInput" type="text" autocomplete="off" aria-label="Your message">
      <button type="submit">Send</button>
    </form>
  </aside>

  <script src="news.js?v=20261052"></script>
  <script src="script.js?v=20262703"></script>
  <script src="totop.js?v=20261401"></script>
  <script src="projects-fx.js?v=20261033"></script>
</body>
</html>
