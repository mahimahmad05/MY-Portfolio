<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261309">
  <link rel="stylesheet" href="projects.css?v=20261181">
  <link rel="stylesheet" href="skills.css?v=20261081">
</head>
<body data-title="Skills">

  <div class="pageload on" id="pageload" aria-hidden="true">
    <div class="pageload__name">MAHIM</div>
    <div class="pageload__bar"><i></i></div>
  </div>

  <header class="nav">
    <a class="nav__logo" id="logo" href="#home"></a>
    <button class="nav__toggle" id="navToggle" aria-label="Menu">☰</button>
    <nav class="nav__links" id="navLinks"></nav>
  </header>

  <main>
    <section class="skills-sec" id="skills" hidden>
      <div class="skills-wrap">
        <div class="sec-head">
          <span class="sec-num"><span class="sec-num-text" id="skillsNum"></span></span>
          <span class="sec-title" id="skillsTitle"></span>
          <span class="sec-head-icon" id="skillsHeadIcon"></span>
          <span class="sec-line"></span>
        </div>
        <div class="sk-hero" id="skHero"><div class="or" id="skillsOrbit" aria-hidden="true"></div></div>
        <p class="skills-intro" id="skillsIntro"></p>
        <div class="skills-filter" id="skillsFilter"></div>
        <div class="skills-grid" id="skillsGrid"></div>

        <div class="sub-sec" id="services" hidden>
          <div class="sub-sec-head">
            <span class="sec-head-icon" id="servicesHeadIcon"></span>
            <span class="sub-sec-title" id="servicesTitle"></span>
          </div>
          <div class="service-grid" id="servicesList"></div>
        </div>
      </div>
    </section>
  </main>

  <aside class="chat" id="chat" hidden aria-label="Chatbot">
    <header class="chat__head">
      <div><strong id="chatTitle"></strong><span id="chatSub"></span></div>
      <button type="button" id="chatClose" aria-label="Close chat">✕</button>
    </header>
    <div class="chat__log" id="chatLog" aria-live="polite"></div>
    <form class="chat__form" id="chatForm">
      <input id="chatInput" type="text" autocomplete="off" aria-label="Your message">
      <button type="submit">Send</button>
    </form>
  </aside>

  <div class="skill-modal" id="skillModal" aria-hidden="true">
    <div class="skill-modal-backdrop" id="skillModalBackdrop"></div>
    <div class="skill-modal-box glow-border always-glow">
      <button class="skill-modal-close" id="skillModalClose" type="button" aria-label="Close">&times;</button>
      <div class="skill-modal-scroll">
        <div class="skill-modal-head">
          <div class="skill-modal-icon" id="skillModalIcon"></div>
          <div>
            <div class="skill-modal-title" id="skillModalTitle"></div>
            <div class="skill-modal-desc" id="skillModalDesc"></div>
          </div>
        </div>
        <div class="skill-modal-rows" id="skillModalRows"></div>
      </div>
    </div>
  </div>

  <script src="projects-fx.js?v=20261033"></script>
  <script src="skills.js?v=20261081"></script>
  <script src="script.js?v=20261309"></script>
</body>
</html>
