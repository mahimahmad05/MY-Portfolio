<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20262803">
  <link rel="stylesheet" href="projects.css?v=20261181">
</head>
<body data-title="Projects">

  <div class="pageload on" id="pageload" aria-hidden="true">
    <div class="pageload__name">MAHIM</div>
    <div class="pageload__bar"><i></i></div>
  </div>
  <script src="loader.js?v=20261319"></script>

  <header class="nav">
    <a class="nav__logo" id="logo" href="#home"></a>
    <button class="nav__toggle" id="navToggle" aria-label="Menu">☰</button>
    <nav class="nav__links" id="navLinks"></nav>
  </header>

  <main>
    <section class="proj-sec" id="projects" hidden>
      <div class="proj-wrap">
        <div class="sec-head">
          <span class="sec-num"><span id="projNum"></span></span>
          <span class="sec-title" id="projTitle"></span>
          <span class="sec-head-icon" id="projHeadIcon"></span>
          <span class="sec-line"></span>
        </div>
        <div class="proj-grid" id="projGrid"></div>

        <div class="proj-gh" id="projGithub" hidden></div>
      </div>
    </section>
  </main>

  <div class="px-modal" id="projModal" aria-hidden="true">
    <div class="px-backdrop" id="projBackdrop"></div>
    <div class="px-box">
      <button class="px-close" id="projClose" type="button" aria-label="Close">&times;</button>
      <img src="" alt="Project screenshot" id="projImage">
      <p class="px-fallback" id="projFallback">Project image not added yet.</p>
    </div>
  </div>

  <aside class="chat" id="chat" hidden aria-label="Chatbot">
    <header class="chat__head">
      <div><strong id="chatTitle"></strong><span id="chatSub"></span></div>
      <button type="button" id="chatClose" aria-label="Close chat">✕</button>
    </header>
    <div class="chat__log" id="chatLog" aria-live="polite"></div>
    <form class="chat__form" id="chatForm">
      <input id="chatInput" type="text" autocomplete="off" aria-label="Your message">
      <button type="submit">Send</button>
    </form>
  </aside>

  <script src="projects.js?v=20261042"></script>
  <script src="projects-fx.js?v=20261033"></script>
  <script src="script.js?v=20262704"></script>
  <script src="totop.js?v=20261401"></script>
</body>
</html>
