<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261402">
  <link rel="stylesheet" href="about.css?v=20262601">
</head>
<body>


  <div class="pageload on" id="pageload" aria-hidden="true">
    <div class="pageload__name">MAHIM</div>
    <div class="pageload__bar"><i></i></div>
  </div>
  <script src="loader.js?v=20261319"></script>

  <div class="splash" id="splash" hidden>
    <div class="splash__name" id="splashName"></div>
    <button class="splash__btn" id="splashBtn"></button>
  </div>

  <header class="nav">
    <a class="nav__logo" id="logo" href="#home"></a>
    <button class="nav__toggle" id="navToggle" aria-label="Menu">☰</button>
    <nav class="nav__links" id="navLinks"></nav>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero__bgname" id="bgName" aria-hidden="true"></div>

      <div class="hero__text">
        <h1 class="hero__role" id="role"></h1>
        <p class="hero__sub" id="subtitle"></p>
      </div>

      <div class="hero__photo">
        <video id="heroVideo" hidden muted loop playsinline preload="metadata"></video>
      </div>

      <button class="voice" id="voiceBtn" type="button" aria-label="Play intro"></button>

      <div class="hero__clock" id="heroClock" hidden aria-label="Current time">
        <div class="ck-row">
          <span class="ck-tile"></span><span class="ck-tile"></span>
          <span class="ck-colon">:</span>
          <span class="ck-tile"></span><span class="ck-tile"></span>
          <span class="ck-side"><b id="clockAmpm"></b><span id="clockSec"></span></span>
        </div>
        <div class="ck-date" id="clockDate"></div>
      </div>

      <div class="hero__actions" id="heroActions"></div>
    </section>

    <section class="ab-sec" id="about" hidden>
      <div class="ab-hero">
       <div class="ab-bg" aria-hidden="true"><img id="abBgImg" alt=""><div class="ab-fade"></div></div>
       <div class="ab-wrap">
        <div class="ab-intro">
          <div class="ab-eyebrow"><span class="ab-ic" id="abEyeIcon"></span><span id="abEyebrow"></span></div>
          <h2 class="ab-name" id="abName"></h2>
          <p class="ab-type"><span class="ab-ic" id="abTwIcon"></span><span id="abType"></span><span class="cur"></span></p>
          <p class="ab-tagline" id="abTagline"></p>
          <div class="ab-cta" id="abCta"></div>
        </div>
       </div>
      </div>
      <div class="ab-marquee" id="abMarquee" aria-hidden="true"><div class="ab-track" id="abTrack"></div></div>
      <div class="ab-wrap ab-wrap--card">
        <div class="ab-card">
          <div class="card-topbar"></div>
          <div class="ab-left">
            <h3 class="ab-heading" id="abHeading"></h3>
            <div class="ab-paras" id="abParas"></div>
          </div>
          <div class="ab-right">
            <div class="ab-info" id="abInfo"></div>
            <div class="ab-stats" id="abStats"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <aside class="chat" id="chat" hidden aria-label="Chatbot">
    <header class="chat__head">
      <div><strong id="chatTitle"></strong><span id="chatSub"></span></div>
      <button type="button" id="chatClose" aria-label="Close chat">✕</button>
    </header>
    <div class="chat__log" id="chatLog" aria-live="polite"></div>
    <form class="chat__form" id="chatForm">
      <input id="chatInput" type="text" autocomplete="off" aria-label="Your message">
      <button type="submit">Send</button>
    </form>
  </aside>

  <script src="about.js?v=20262501"></script>
  <script src="script.js?v=20261501"></script>
  <script src="totop.js?v=20261401"></script>
</body>
</html>
